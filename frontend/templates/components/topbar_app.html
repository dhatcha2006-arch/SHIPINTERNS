<header class="sf-topbar">
  <div class="d-flex align-items-center gap-3">
    <button class="btn btn-sm btn-ghost d-lg-none" onclick="SkillForgeUI.toggleSidebar()">
      <i data-lucide="menu"></i>
    </button>
    <div class="d-none d-md-flex align-items-center gap-2">
      <span class="sf-badge sf-badge-primary">Spring 2026 Cohort</span>
      <span class="text-slate-400">•</span>
      <span class="text-slate-500 small">Sprint 4: Cloud Architecture & CI/CD</span>
    </div>
  </div>

  <div class="d-flex align-items-center gap-3">
    <!-- Quick Search -->
    <div class="position-relative d-none d-sm-block">
      <input type="text" class="sf-input py-1 px-3 pe-5" style="width: 240px; font-size: 0.8125rem;" placeholder="Search syllabus, tasks...">
      <i data-lucide="search" class="position-absolute top-50 end-0 translate-middle-y me-2 text-slate-400" style="width: 14px; height: 14px;"></i>
    </div>

    <!-- Notification Bell -->
    <div class="dropdown">
      <button class="btn btn-sm btn-sf-ghost position-relative" id="notifDropdown" data-bs-toggle="dropdown" aria-expanded="false">
        <i data-lucide="bell"></i>
        <span class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle"></span>
      </button>
      <div class="dropdown-menu dropdown-menu-end shadow-sm border p-0" style="width: 320px;" aria-labelledby="notifDropdown">
        <div class="p-3 border-bottom d-flex justify-content-between align-items-center">
          <span class="fw-semibold small">Notifications</span>
          <span class="sf-badge sf-badge-primary">3 New</span>
        </div>
        <div class="p-2">
          <a href="{{ url_for('student_assignments') }}" class="dropdown-item p-2 rounded small text-wrap">
            <div class="fw-semibold text-slate-900">Assignment Evaluated</div>
            <div class="text-muted small">Mentor Priya approved your Microservices Assignment with 96/100.</div>
          </a>
          <a href="{{ url_for('zoom_meet') }}" class="dropdown-item p-2 rounded small text-wrap">
            <div class="fw-semibold text-slate-900">Sprint Review at 4:00 PM</div>
            <div class="text-muted small">Google Meet link updated for your supervised squad.</div>
          </a>
        </div>
      </div>
    </div>

    <!-- User Profile Dropdown -->
    <div class="dropdown">
      <button class="btn p-0 border-0 d-flex align-items-center gap-2" id="userMenuDropdown" data-bs-toggle="dropdown" aria-expanded="false">
        <div class="rounded-circle bg-slate-200 text-slate-800 d-flex align-items-center justify-content-center fw-bold" style="width: 36px; height: 36px; font-size: 0.875rem;">
          AC
        </div>
        <div class="d-none d-md-block text-start" style="line-height: 1.2;">
          <div class="fw-semibold small text-slate-900" id="topbarUserName">Alex Chen</div>
          <div class="text-slate-400 small" style="font-size: 0.75rem;">Student Intern</div>
        </div>
      </button>
      <ul class="dropdown-menu dropdown-menu-end shadow-sm border" aria-labelledby="userMenuDropdown">
        <li><a class="dropdown-item small" href="{{ url_for('student_profile') }}"><i data-lucide="user" class="me-2" style="width: 14px;"></i> My Profile</a></li>
        <li><a class="dropdown-item small" href="{{ url_for('student_analytics') }}"><i data-lucide="bar-chart-2" class="me-2" style="width: 14px;"></i> Analytics</a></li>
        <li><hr class="dropdown-divider"></li>
        <li><button class="dropdown-item small text-danger" onclick="SkillForgeAPI.auth.logout()"><i data-lucide="log-out" class="me-2" style="width: 14px;"></i> Logout</button></li>
      </ul>
    </div>
  </div>
</header>
